schedule:
  # 采集 + 分析的轮询间隔（分钟）
  collectIntervalMinutes: 60
  # 每天生成简报的时刻（可配多个）
  briefTimes:
    - "09:00"
    - "21:00"
  # 免打扰时段（预留给未来的即时警报通道）
  quietHours:
    start: "23:30"
    end: "08:00"

analysis:
  # Analyst 单批处理条目上限
  batchSize: 60
  # 传给模型的条目摘要截断长度（字符）
  excerptLength: 400
  # 达到该评分视为重大事件（预留给即时警报）
  alertThreshold: 9
  # 单个源最多积压多少条待分析条目，超出的从旧到新静默丢弃。
  # 兜底 backlog 突增：换 url、久禁重启、源批量回填历史时，
  # 整批存量会一次性涌进 Analyst 挤掉真正的新消息。0 表示不限制。
  maxPendingPerSource: 50

server:
  host: 127.0.0.1
  port: 8787
