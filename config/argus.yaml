schedule:
  # 采集 + 分析的轮询间隔（分钟）
  collectIntervalMinutes: 60
  # 每天生成简报的时刻（可配多个）
  briefTimes:
    - "09:00"
    - "21:00"
  # 免打扰时段（预留给未来的即时警报通道）
  quietHours:
    start: "23:30"
    end: "08:00"

analysis:
  # Analyst 单批处理条目上限
  batchSize: 60
  # 传给模型的条目摘要截断长度（字符）
  excerptLength: 400
  # 达到该评分视为重大事件（预留给即时警报）
  alertThreshold: 9

server:
  host: 127.0.0.1
  port: 8787
