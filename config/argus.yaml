# Argus 主配置：信息源、调度、分析行为、Web 服务
# 模型密钥不在这里，放 .env（见 .env.example）

# 镜像组：源 url 写成 "{rsshub}/路径" 即展开为下列各地址，
# 第一个是主地址，其余在主地址失败时依次回退。
# 多个源共用一个自建实例时，换实例或加备用只改这一处。
mirrors:
  rsshub:
    - https://rsshub.antest.cc.cd
    # 再挂一个备用实例，避免单点故障时 X 源整片哑掉：
    # - https://rsshub.example.com

