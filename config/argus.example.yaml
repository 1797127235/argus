# Argus 主配置：信息源、调度、分析行为、Web 服务
# 模型密钥不在这里，放 .env（见 .env.example）

# 镜像组：源 url 写成 "{组名}/路径" 即展开为组内各地址，
# 第一个是主地址，其余在主地址失败时依次回退。
# 多个源共用一个自建实例（如一堆 X 源都走同一台 RSSHub）时，
# 换实例或加备用只改这一处，实例挂掉也不会整片哑掉。
# mirrors:
#   rsshub:
#     - https://rsshub.example.com
#     - https://rsshub-backup.example.com

sources:
  - id: hn-best
    name: Hacker News 精选
    type: rss
    url: https://hnrss.org/best
    enabled: true
  - id: simonwillison
    name: Simon Willison（AI 工程）
    type: rss
    url: https://simonwillison.net/atom/everything/
    enabled: true
  - id: arstechnica
    name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    enabled: true
  - id: theverge
    name: The Verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    enabled: true
  - id: mit-tr
    name: MIT 科技评论
    type: rss
    url: https://www.technologyreview.com/feed/
    enabled: true
  - id: huggingface
    name: Hugging Face 博客
    type: rss
    url: https://huggingface.co/blog/feed.xml
    enabled: true
  - id: sspai
    name: 少数派
    type: rss
    url: https://sspai.com/feed
    enabled: true
  - id: 36kr
    name: 36氪
    type: rss
    url: https://36kr.com/feed
    enabled: true
  - id: infoq-cn
    name: InfoQ 中文
    type: rss
    url: https://www.infoq.cn/feed
    enabled: true

schedule:
  # 采集 + 分析的轮询间隔（分钟）
  collectIntervalMinutes: 60
  # 每天生成简报的时刻（可配多个）
  briefTimes:
    - "09:00"
    - "21:00"
  # 免打扰时段（预留给未来的即时警报通道）
  quietHours:
    start: "23:30"
    end: "08:00"

analysis:
  # Analyst 单批处理条目上限
  batchSize: 60
  # 传给模型的条目摘要截断长度（字符）
  excerptLength: 400
  # 达到该评分视为重大事件（预留给即时警报）
  alertThreshold: 9
  # 单个源最多积压多少条待分析条目，超出的从旧到新静默丢弃。
  # 兜底 backlog 突增：换 url、久禁重启、源批量回填历史时，
  # 整批存量会一次性涌进 Analyst 挤掉真正的新消息。0 表示不限制。
  maxPendingPerSource: 50

server:
  host: 127.0.0.1
  port: 8787
